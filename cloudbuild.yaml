steps:
  # Build Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/neurosense-backend', '-f', 'backend/Dockerfile', '.']

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/neurosense-frontend', './frontend']

  # Push Backend image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/neurosense-backend']

  # Push Frontend image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/neurosense-frontend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'neurosense-backend'
      - '--image=gcr.io/$PROJECT_ID/neurosense-backend'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5001'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--set-env-vars=PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'neurosense-frontend'
      - '--image=gcr.io/$PROJECT_ID/neurosense-frontend'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=512Mi'

images:
  - 'gcr.io/$PROJECT_ID/neurosense-backend'
  - 'gcr.io/$PROJECT_ID/neurosense-frontend'
