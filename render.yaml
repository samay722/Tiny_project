services:
  - type: web
    name: neurosense-api
    runtime: docker
    plan: starter # ML models require 2GB RAM
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 5001
    disk:
      name: neurosense-data
      mountPath: /app/data
      sizeGB: 1
