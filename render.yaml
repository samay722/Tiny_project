services:
  # Backend API Service
  - type: web
    name: neurosense-api
    runtime: docker
    plan: starter # ML models require 2GB RAM
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 5001
      - key: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
    disk:
      name: neurosense-data
      mountPath: /app/data
      sizeGB: 1

  # Frontend Static Service
  - type: web
    name: neurosense-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    ports:
      - 80
    envVars:
      - key: BACKEND_URL
        value: https://neurosense-api.onrender.com # Change this if your API URL is different

